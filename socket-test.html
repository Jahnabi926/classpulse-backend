<!doctype html>
<html>
  <head>
    <title>ClassPulse Socket Test</title>
  </head>
  <body>
    <h2>Step 1: Log in (sets the cookie in THIS browser)</h2>
    <input id="email" placeholder="email" value="jahnabi@gmail.com" /><br />
    <input id="password" placeholder="password" type="password" /><br />
    <button onclick="login()">Login</button>
    <p id="loginStatus"></p>

    <h2>Step 2: Connect socket + join a class</h2>
    <button onclick="connectSocket()">Connect Socket</button><br /><br />
    <input
      id="classId"
      placeholder="Paste a classId here"
      style="width: 300px"
    />
    <button onclick="joinClass()">Join Class</button>

    <p><b>Open your browser console (F12) to see all logs.</b></p>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script>
      let socket = null;

      async function login() {
        const emailId = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const res = await fetch("http://localhost:3000/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include", // sends/receives cookies, same as Postman's cookie jar behavior
          body: JSON.stringify({ emailId, password }),
        });

        const data = await res.json();
        document.getElementById("loginStatus").innerText = res.ok
          ? "Logged in! Cookie set in this browser."
          : "Login failed: " + JSON.stringify(data);
        console.log("Login response:", data);
      }

      function connectSocket() {
        socket = io("http://localhost:3000", { withCredentials: true });

        socket.on("connect", () => {
          console.log("Socket", socket);
          console.log("✅ Connected! Socket ID:", socket.id);
        });

        socket.on("connect_error", (err) => {
          console.error("❌ Connection failed:", err.message);
        });
      }

      function joinClass() {
        const classId = document.getElementById("classId").value;
        socket.emit("joinClass", { classId });
        console.log("Emitted joinClass with:", classId);
      }
    </script>
  </body>
</html>
